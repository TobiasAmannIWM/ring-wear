[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ringwear"
version = "0.1.0"
description = "Ring wear area analysis from microscopy images"
requires-python = ">=3.10"
dependencies = [
    "Pillow",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
reports = ["openpyxl", "python-pptx"]

[project.scripts]
ring-wear = "ringwear.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ringwear*"]
